services:
  app:
    build: .
    container_name: webapp
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=ecoride
      - DB_USER=ecoride
      - DB_PASS=ecoride
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysqldb
    environment:
      - MYSQL_DATABASE=ecoride
      - MYSQL_USER=ecoride
      - MYSQL_PASSWORD=ecoride
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    container_name: pma
    environment:
      - PMA_HOST=db
    ports:
      - "8081:80"

volumes:
  dbdata:
